name: Run ENTSO-E notebooks
  
on:
  workflow_dispatch:

  schedule:
    # Every day at 06:00 UTC
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  run-notebooks:
    runs-on: ubuntu-latest

    env:
      ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}

    steps:    
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Create executed notebooks directory
        run: |
          mkdir -p daily_updated_notebooks

      - name: Run all notebooks
        run: |
          for notebook in notebooks/*.ipynb; do
            filename=$(basename "$notebook")
            echo "Running $filename"
      
            jupyter nbconvert \
              --to notebook \
              --execute "$notebook" \
              --output "$filename" \
              --output-dir daily_updated_notebooks/
          done
                

      - name: Commit updated notebooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add daily_updated_notebooks/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update daily notebooks"
            git push
          fi
